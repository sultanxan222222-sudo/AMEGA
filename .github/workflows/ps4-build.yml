name: PS4 homebrew build

on:
  push:
    paths:
      - "src/ps4/**"
      - "tests/**"
      - "tools/generate_icon.py"
      - "tools/create_gp4.py"
      - ".github/workflows/ps4-build.yml"
  pull_request:
    paths:
      - "src/ps4/**"
      - "tests/**"
      - "tools/generate_icon.py"
      - "tools/create_gp4.py"
      - ".github/workflows/ps4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test transfer helpers and SHA-256
        run: |
          g++ -std=c++11 -O2 tests/transfer-helper-test.cpp -o /tmp/amega-transfer-test
          /tmp/amega-transfer-test

      - name: Generate package icon
        run: python3 tools/generate_icon.py src/ps4/sce_sys/icon0.png

      - name: Clean previous PS4 build output
        run: |
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/ps4 \
            openorbisofficial/toolchain:latest \
            bash -lc 'make clean'

      - name: Generate GP4 manifest
        run: |
          python3 tools/create_gp4.py \
            --template src/ps4/openorbis-template.gp4 \
            --content-id IV0000-AMEG00001_00-AMEGARECEIVER000 \
            --output src/ps4/pkg.gp4

      - name: Build AMEGA PS4 PKG with OpenOrbis
        run: |
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/ps4 \
            openorbisofficial/toolchain:latest \
            bash -lc 'make all'

      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: AMEGA-PS4-prototype
          path: src/ps4/AMEGA-PS4.pkg
          if-no-files-found: error
