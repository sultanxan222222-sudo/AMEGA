name: PS4 homebrew build

on:
  push:
    paths:
      - "src/ps4/**"
      - "tools/generate_icon.py"
      - "tools/create_gp4.py"
      - "tools/test_sha256.cpp"
      - "tools/test_downloader.cpp"
      - "tools/test_downloader.py"
      - "src/ps4/receiver/sha256.h"
      - ".github/workflows/ps4-build.yml"
  pull_request:
    paths:
      - "src/ps4/**"
      - "tools/generate_icon.py"
      - "tools/create_gp4.py"
      - ".github/workflows/ps4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test portable SHA-256 implementation
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            tools/test_sha256.cpp -o /tmp/amega-sha256-test
          /tmp/amega-sha256-test

      - name: Test resumable HTTP Range download and receiver digest
        run: python3 tools/test_downloader.py

      - name: Generate package icon
        run: python3 tools/generate_icon.py src/ps4/sce_sys/icon0.png

      - name: Clean previous PS4 build output
        run: |
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/ps4 \
            openorbisofficial/toolchain@sha256:f752d09f9d3227c729ee069f29a05450bd8fa4ef5e785c0929ab8479f7dc4e64 \
            bash -lc 'make clean'

      - name: Generate GP4 manifest
        run: |
          python3 tools/create_gp4.py \
            --template src/ps4/openorbis-template.gp4 \
            --content-id IV0000-AMEG00001_00-AMEGARECEIVER000 \
            --output src/ps4/pkg.gp4

      - name: Build AMEGA PS4 PKG with OpenOrbis
        run: |
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/src/ps4 \
            openorbisofficial/toolchain@sha256:f752d09f9d3227c729ee069f29a05450bd8fa4ef5e785c0929ab8479f7dc4e64 \
            bash -lc 'make all'

      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: AMEGA-PS4-prototype
          path: src/ps4/AMEGA-PS4.pkg
          if-no-files-found: error
