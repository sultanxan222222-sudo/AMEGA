name: Windows build

on:
  push:
    paths:
      - "src/windows/**"
      - "tests/range-coverage/**"
      - "tests/windows-ui/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "src/windows/**"
      - "tests/range-coverage/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test HTTP Range progress accounting
        run: dotnet run --project tests/range-coverage/RangeCoverage.Tests.csproj -c Release

      - name: Exercise WinForms Search, Stop and Restart buttons
        run: dotnet run --project tests/windows-ui/WindowsUi.Tests.csproj -c Release

      - name: Publish self-contained Windows x64 app
        run: >
          dotnet publish src/windows/AMEGA.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/windows

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMEGA-Windows-unsigned
          path: artifacts/windows/
          if-no-files-found: error
